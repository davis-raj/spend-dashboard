<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Davis Family - Spend Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; padding: 20px; max-width: 100vw; overflow-x: hidden; }
.header { text-align: center; margin-bottom: 30px; }
.header h1 { font-size: 28px; color: #1a1a2e; margin-bottom: 5px; }
.header p { color: #666; font-size: 14px; }
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 30px; }
.stat-card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.stat-card .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
.stat-card .sub { font-size: 12px; color: #999; margin-top: 4px; }
.positive { color: #27ae60; } .negative { color: #e74c3c; } .neutral { color: #2c3e50; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .stats-row { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); } .header h1 { font-size: 22px; } }
.card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); min-width: 0; overflow: hidden; }
.card h3 { font-size: 16px; color: #1a1a2e; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card.full { grid-column: 1 / -1; }
canvas { max-height: 300px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 12px; background: #f8f9fa; color: #555; border-bottom: 2px solid #e9ecef; position: sticky; top: 0; }
td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
tr:hover td { background: #f8f9ff; }
.amount { font-weight: 600; text-align: right; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; background: #e8f4fd; color: #2980b9; }
.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.filter-bar select, .filter-bar input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: white; min-width: 0; }
.filter-bar input { width: 200px; max-width: 100%; }
.txn-scroll { max-height: 400px; overflow-y: auto; border-radius: 8px; border: 1px solid #e9ecef; }
.sortable { cursor: pointer; user-select: none; } .sortable:hover { color: #2980b9; }
#loading { text-align: center; padding: 60px; font-size: 18px; color: #888; }
.month-btns { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.month-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid #ddd; background: #f8f9fa; font-size: 12px; cursor: pointer; font-weight: 500; transition: all 0.15s; }
.month-btn:hover { background: #e8f4fd; border-color: #2980b9; }
.month-btn.active { background: #2980b9; color: white; border-color: #2980b9; }
</style>
</head>
<body>
<div class="header">
<h1>💰 The Davis Family - Spend Dashboard</h1>
<p id="lastSynced" style="font-size:13px;margin-top:6px;"></p>
</div>
<div id="loading">Loading data...</div>
<div id="app" style="display:none;">
<div class="stats-row" id="stats-row"></div>
<div class="grid">
<div class="card full"><h3>📊 Monthly Overview</h3><canvas id="monthlyChart"></canvas></div>
<div class="card"><h3>💵 Income by Category <span class="month-btns" id="incBtns"></span></h3><canvas id="incChart"></canvas></div>
<div class="card"><h3>🏷️ Spending by Category <span class="month-btns" id="catBtns"></span></h3><canvas id="catChart"></canvas></div>
<div class="card full"><h3>🏪 Top Merchants <span class="month-btns" id="merchBtns"></span></h3><div id="merchList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;"></div></div>
<div class="card full"><h3>📈 Income Trends</h3><div class="month-btns" id="incTrendBtns" style="margin-bottom:12px;"></div><canvas id="incTrendChart"></canvas></div>
<div class="card full"><h3>📈 Spending Trends</h3><div class="month-btns" id="trendCatBtns" style="margin-bottom:12px;"></div><canvas id="trendChart"></canvas></div>
</div>
<div class="card full" style="margin-bottom:30px;">
<h3>🔍 All Transactions</h3>
<div class="filter-bar">
<span class="month-btns" id="txnMonthBtns"></span>
<select id="filterCat"><option value="">All Categories</option></select>
<input type="text" id="filterSearch" placeholder="Search merchant...">
</div>
<div class="txn-scroll"><table><thead><tr><th class="sortable" data-col="Date">Date ↕</th><th class="sortable" data-col="Merchant">Merchant ↕</th><th class="sortable" data-col="Category">Category ↕</th><th class="sortable" data-col="Account">Account ↕</th><th class="sortable amount" data-col="Spend">Amount ↕</th></tr></thead><tbody id="txnBody"></tbody></table></div>
<p id="txnCount" style="margin-top:8px;font-size:12px;color:#888;"></p>
</div>
</div>

<script>
fetch('data.json').then(r => r.json()).then(DATA => {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';

  // Data-freshness indicator — shows how recent the newest transaction is.
  // DATA.latestTransactionDate is the max transaction date ('YYYY-MM-DD'),
  // written by build.py. This is deterministic (not a file/build timestamp),
  // so it reflects the actual data content regardless of where the build ran.
  (function showLatestTxn() {
    const el = document.getElementById('lastSynced');
    if (!el) return;
    const ds = DATA.latestTransactionDate;
    if (!ds) { el.textContent = 'Latest transaction: unknown'; el.style.color = '#e67e22'; return; }
    // Parse 'YYYY-MM-DD' as a local date (avoid UTC-midnight off-by-one).
    const [y, mo, d] = ds.split('-').map(Number);
    const latest = new Date(y, mo - 1, d);
    if (isNaN(latest)) { el.textContent = 'Latest transaction: unknown'; el.style.color = '#e67e22'; return; }
    // Whole-day difference from today (local midnight to local midnight).
    const today = new Date();
    const days = Math.round((new Date(today.getFullYear(), today.getMonth(), today.getDate()) - latest) / 86400000);
    let rel;
    if (days <= 0)      rel = 'today';
    else if (days === 1) rel = 'yesterday';
    else                 rel = days + ' days ago';
    // Absolute local date so the exact day is unambiguous.
    const abs = latest.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    // Color cue: green ≤2 days, amber 3–5 days, red when clearly stale.
    const color = days <= 2 ? '#27ae60' : days <= 5 ? '#e67e22' : '#e74c3c';
    el.innerHTML = `🔄 Latest transaction: <strong>${rel}</strong> <span style="color:#888">(${abs})</span>`;
    el.style.color = color;
  })();

  // Crisp text rendering on HiDPI/Retina displays
  Chart.defaults.devicePixelRatio = window.devicePixelRatio || 2;
  Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  Chart.defaults.font.size = 12;

  const monthShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function monthLabel(m) { return monthShort[parseInt(m.split('-')[1])-1]; }

  // Create month button group, returns getter function for current value
  function createMonthBtns(containerId, onChange) {
    const container = document.getElementById(containerId);
    const btns = [];
    const currentMonth = DATA.monthly[DATA.monthly.length - 1]?.month || '';
    const ytd = document.createElement('span');
    ytd.className = 'month-btn'; ytd.textContent = 'YTD'; ytd.dataset.value = '';
    container.appendChild(ytd); btns.push(ytd);
    DATA.monthly.forEach(m => {
      const b = document.createElement('span');
      b.className = 'month-btn' + (m.month === currentMonth ? ' active' : ''); b.textContent = monthLabel(m.month); b.dataset.value = m.month;
      container.appendChild(b); btns.push(b);
    });
    let current = currentMonth;
    btns.forEach(b => b.onclick = () => {
      btns.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      current = b.dataset.value;
      onChange(current);
    });
    onChange(current);
    return () => current;
  }

  // Exclude current (incomplete) month from totals/averages — it skews everything.
  // The charts still show July; only the stat cards use completed months.
  const now = new Date();
  const currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const completed = DATA.monthly.filter(m => m.month !== currentMonth);
  const nCompleted = completed.length || 1;

  const totalExp = completed.reduce((s,m) => s + m.expenses, 0);
  const totalInc = completed.reduce((s,m) => s + m.income, 0);
  const avgMonthly = totalExp / nCompleted;
  const net = totalInc - totalExp;
  const avgInc = totalInc / nCompleted;
  const avgNet = avgInc - avgMonthly;
  const savingsRate = totalInc > 0 ? (net / totalInc * 100) : 0;
  document.getElementById('stats-row').innerHTML = `
  <div class="stat-card"><div class="label">Total Income</div><div class="value positive">$${totalInc.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="sub">${nCompleted} completed months</div></div>
  <div class="stat-card"><div class="label">Total Spent</div><div class="value" style="color:#e67e22">$${totalExp.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="sub">${nCompleted} completed months</div></div>
  <div class="stat-card"><div class="label">Net Cashflow</div><div class="value ${net>=0?'positive':'negative'}">$${net.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="sub">${net>=0?'surplus':'deficit'}</div></div>
  <div class="stat-card"><div class="label">Savings Rate</div><div class="value ${savingsRate>=0?'positive':'negative'}">${savingsRate.toFixed(1)}%</div><div class="sub">${savingsRate>=0?'saving':'overspending'}</div></div>
  <div class="stat-card"><div class="label">Avg Monthly Income</div><div class="value positive">$${avgInc.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="sub">per month</div></div>
  <div class="stat-card"><div class="label">Avg Monthly Spend</div><div class="value" style="color:#e67e22">$${avgMonthly.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="sub">per month</div></div>`;

  // Year-over-year window for the trend charts: show only the trailing 13 months,
  // inclusive — from the same month one year ago through the current month.
  // e.g. if current month is 2026-10, the window is 2026-10 back to 2025-10.
  const windowStart = `${now.getFullYear()-1}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const windowMonthly = DATA.monthly.filter(m => m.month >= windowStart && m.month <= currentMonth);
  // Chart x-axis = windowed months. Use 'YY labels so Oct 2025 vs Oct 2026 are distinguishable.
  const months = windowMonthly.map(m => m.month);
  const yoyLabel = m => monthShort[parseInt(m.split('-')[1])-1] + " '" + m.split('-')[0].slice(2);
  // Averages for the chart dashed lines, computed over the VISIBLE window
  // (excluding the current incomplete month so it doesn't skew the average).
  const winCompleted = windowMonthly.filter(m => m.month !== currentMonth);
  const nWin = winCompleted.length || 1;
  const winAvgInc = winCompleted.reduce((s,m)=>s+m.income,0) / nWin;
  const winAvgExp = winCompleted.reduce((s,m)=>s+m.expenses,0) / nWin;
  // Headroom above the tallest bar so the (tall, vertical) dollar labels fit.
  const monthlyYMax = Math.max(1, ...windowMonthly.map(m => Math.max(m.income, m.expenses))) * 1.28;

  new Chart(document.getElementById('monthlyChart'), {
    type: 'bar', data: { labels: months.map(yoyLabel), datasets: [
      { label: 'Income', data: windowMonthly.map(m=>m.income), backgroundColor: '#27ae6088', borderColor: '#27ae60', borderWidth: 1 },
      { label: 'Expenses', data: windowMonthly.map(m=>m.expenses), backgroundColor: '#e74c3c88', borderColor: '#e74c3c', borderWidth: 1 },
      { label: 'Net Cashflow', data: windowMonthly.map(m=>m.income-m.expenses), type: 'line', borderColor: '#2c3e50', backgroundColor: '#2c3e5022', borderWidth: 2.5, pointRadius: 5, pointBackgroundColor: windowMonthly.map(m => (m.income-m.expenses)>=0 ? '#27ae60' : '#e74c3c'), fill: true, tension: 0.3, datalabels: { display: true } },
      { label: 'Avg Income', data: windowMonthly.map(()=>winAvgInc), type: 'line', borderColor: '#27ae60', borderDash: [6,4], borderWidth: 2, pointRadius: 0, fill: false },
      { label: 'Avg Expenses', data: windowMonthly.map(()=>winAvgExp), type: 'line', borderColor: '#e74c3c', borderDash: [6,4], borderWidth: 2, pointRadius: 0, fill: false },
    ]}, options: { responsive: true, plugins: { legend: { position: 'bottom' } },
      onHover: (e, els) => { e.native.target.style.cursor = els.length && els[0].datasetIndex < 2 ? 'pointer' : 'default'; },
      onClick: (e, els) => {
        if (!els.length) return;
        const el = els[0];
        const month = months[el.index];
        if (el.datasetIndex === 0) { renderIncTxns(month); }        // Income bar -> income txns
        else if (el.datasetIndex === 1) { txnMonth = month; renderTxns(); }  // Expenses bar -> spend txns
        else { return; }                                            // ignore the avg lines
        document.getElementById('filterCat').scrollIntoView({ behavior: 'smooth', block: 'center' });
      },
      scales: { y: { suggestedMax: monthlyYMax, ticks: { callback: v => '$'+(v/1000).toFixed(0)+'k' } } } },
    plugins: [{ afterDatasetsDraw(chart) {
      const ctx = chart.ctx;
      // Vertical dollar labels on top of the Income (0) & Expenses (1) bars,
      // matching the Income Trends chart style.
      [0, 1].forEach(di => {
        const m = chart.getDatasetMeta(di);
        if (!m || m.hidden) return;
        ctx.save();
        ctx.fillStyle = chart.data.datasets[di].borderColor;
        m.data.forEach((bar, i) => {
          const val = chart.data.datasets[di].data[i];
          if (!val || val <= 0) return;
          const label = val >= 1000 ? '$' + (val/1000).toFixed(1) + 'k' : '$' + Math.round(val);
          // Maximize readability: labels are rotated vertical, so make the text
          // roughly as tall as the bar is wide (never below a readable floor).
          const barW = bar.width || 20;
          const size = Math.max(13, Math.min(barW * 0.85, 20));
          ctx.font = 'bold ' + size.toFixed(1) + 'px -apple-system, sans-serif';
          ctx.save();
          ctx.translate(bar.x, bar.y - 4);   // just above the bar
          ctx.rotate(-Math.PI / 2);          // read bottom-to-top
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, 0, 0);
          ctx.restore();
        });
        ctx.restore();
      });
      // Net Cashflow point labels (unchanged).
      const meta = chart.getDatasetMeta(2); // Net Cashflow is dataset index 2
      if (!meta || meta.hidden) return;
      ctx.save(); ctx.font = 'bold 11px -apple-system, sans-serif'; ctx.textAlign = 'center';
      meta.data.forEach((pt, i) => {
        const val = chart.data.datasets[2].data[i];
        const label = (val >= 0 ? '+' : '') + '$' + (val/1000).toFixed(1) + 'k';
        ctx.fillStyle = val >= 0 ? '#27ae60' : '#e74c3c';
        ctx.fillText(label, pt.x, pt.y + (val >= 0 ? -12 : 16));
      });
      ctx.restore();
    }}]
  });

  const catColors = ['#3498db','#e74c3c','#f39c12','#27ae60','#9b59b6','#1abc9c','#e67e22','#2980b9','#c0392b','#16a085','#8e44ad','#d35400','#2c3e50','#7f8c8d','#f1c40f'];

  // Stable color per category NAME so a category keeps the same color across all
  // months/charts (seeded from the YTD ranking; new names get the next color).
  // Stable color per category NAME — seeded from ALL categories in the data
  // so every category always gets the same color regardless of which month is selected.
  const catColorMap = {};
  const allCatNames = [...new Set(DATA.transactions.map(t => t.Category))].sort((a,b) => {
    const ta = DATA.transactions.filter(t=>t.Category===a).reduce((s,t)=>s+t.Spend,0);
    const tb = DATA.transactions.filter(t=>t.Category===b).reduce((s,t)=>s+t.Spend,0);
    return tb - ta;
  });
  allCatNames.forEach((name, i) => { catColorMap[name] = catColors[i % catColors.length]; });
  function colorFor(name) {
    if (!(name in catColorMap)) catColorMap[name] = catColors[Object.keys(catColorMap).length % catColors.length];
    return catColorMap[name];
  }

  // Category donut with buttons
  let catChart = null;
  function renderCatDonut(selMonth) {
    let catData;
    if (!selMonth) { catData = DATA.categories; }
    else {
      const bycat = {};
      DATA.transactions.filter(t => t.Month === selMonth).forEach(t => { bycat[t.Category] = (bycat[t.Category]||0) + t.Spend; });
      catData = Object.entries(bycat).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([name,total])=>({name,total:Math.round(total)}));
    }
    if (catChart) catChart.destroy();
    catChart = new Chart(document.getElementById('catChart'), {
      type: 'doughnut', data: { labels: catData.map(c=>c.name), datasets: [{ data: catData.map(c=>c.total), backgroundColor: catData.map(c=>colorFor(c.name)) }] },
      options: { responsive: true, onClick: (e, els) => { if(els.length) filterByCat(catData[els[0].index].name); }, plugins: { legend: { position: 'right', labels: { font: { size: 12 } } } } }
    });
  }
  // Declared early: the month-button callbacks fire immediately and call
  // renderTxns()/renderIncTxns() which read these. (let/const are not hoisted.)
  const cSel = document.getElementById('filterCat');
  let sortCol = 'Date', sortAsc = false;
  let txnMonth = '';
  // Transactions-widget view mode so the txnMonthBtns month buttons re-apply the
  // ACTIVE view instead of always rendering spending.
  // 'spending'      -> DATA.transactions (default)
  // 'incomeAll'     -> all income sources for the selected month
  // 'incomeSource'  -> a single income source (txnIncSource), scoped to txnMonth
  let txnMode = 'spending';
  let txnIncSource = null;
  createMonthBtns('catBtns', (m) => { renderCatDonut(m); txnMonth = m; renderTxns(); });

  // Income by category donut with buttons
  let incChart = null;
  function renderIncDonut(selMonth) {
    let incData;
    if (!selMonth) {
      incData = DATA.incomeCategories;
    } else {
      const bySource = {};
      (DATA.incomeTransactions||[]).filter(t => t.Month === selMonth).forEach(t => { bySource[t.IncomeSource] = (bySource[t.IncomeSource]||0) + t.Amount; });
      incData = Object.entries(bySource).sort((a,b)=>b[1]-a[1]).map(([name,total])=>({name,total:Math.round(total)}));
    }
    if (incChart) incChart.destroy();
    const incColors = ['#2ecc71','#3498db','#9b59b6','#f1c40f','#e67e22','#1abc9c','#e74c3c'];
    incChart = new Chart(document.getElementById('incChart'), {
      type: 'doughnut', data: { labels: incData.map(c=>c.name), datasets: [{ data: incData.map(c=>c.total), backgroundColor: incColors }] },
      options: { responsive: true, onClick: (e, els) => { if(els.length) filterByIncCat(incData[els[0].index].name); }, plugins: { legend: { position: 'right', labels: { font: { size: 12 } } } } }
    });
  }
  createMonthBtns('incBtns', (m) => { renderIncDonut(m); txnMonth = m; renderIncTxns(m); });

  // Top Merchants with month buttons
  function renderMerchants(selMonth) {
    let txns = DATA.transactions;
    if (selMonth) txns = txns.filter(t => t.Month === selMonth);
    const byMerch = {};
    txns.forEach(t => { byMerch[t.Merchant] = (byMerch[t.Merchant]||0) + t.Spend; });
    const sorted = Object.entries(byMerch).sort((a,b)=>b[1]-a[1]).slice(0,12);
    const maxVal = sorted[0]?.[1] || 1;
    document.getElementById('merchList').innerHTML = sorted.map(([name, total]) => {
      const pct = (total/maxVal*100).toFixed(0);
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:#f8f9fa;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;" onclick="filterByMerch('${name.replace(/'/g,"\\'")}');">${name}</div>
          <div style="height:4px;background:#e9ecef;border-radius:2px;margin-top:3px;">
            <div style="height:100%;width:${pct}%;background:#3498db;border-radius:2px;"></div>
          </div>
        </div>
        <div style="font-size:13px;font-weight:600;color:#2c3e50;">$${Math.round(total).toLocaleString()}</div>
      </div>`;
    }).join('');
  }
  createMonthBtns('merchBtns', (m) => { renderMerchants(m); });

  // Trend chart with category toggles
  const allTrendCats = Object.keys(DATA.catByMonth).sort((a,b) => {
    const ta = Object.values(DATA.catByMonth[a]).reduce((s,v)=>s+v,0);
    const tb = Object.values(DATA.catByMonth[b]).reduce((s,v)=>s+v,0);
    return tb - ta;
  });
  const defaultOn = new Set(allTrendCats.slice(0, 5));  // Top 5 by $ amount
  const activeCats = new Set(defaultOn);
  const trendContainer = document.getElementById('trendCatBtns');
  let trendChart = null;

  const clearBtn = document.createElement('span');
  clearBtn.className = 'month-btn'; clearBtn.textContent = '✕ Clear';
  clearBtn.onclick = () => { activeCats.clear(); trendContainer.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active')); clearBtn.classList.remove('active'); renderTrend(); };
  trendContainer.appendChild(clearBtn);

  allTrendCats.forEach(c => {
    const b = document.createElement('span');
    b.className = 'month-btn' + (activeCats.has(c) ? ' active' : '');
    b.textContent = c;
    b.onclick = () => {
      if (activeCats.has(c)) { activeCats.delete(c); b.classList.remove('active'); }
      else { activeCats.add(c); b.classList.add('active'); }
      renderTrend();
      // Also filter transactions to show this category
      filterByCat(c);
    };
    trendContainer.appendChild(b);
  });

  function renderTrend() {
    const cats = [...activeCats];
    const ds = cats.map((c,i) => ({
      label: c, data: DATA.monthly.map(m => (DATA.catByMonth[c]||{})[m.month]||0),
      borderColor: colorFor(c), backgroundColor: colorFor(c)+'33', fill: true, tension: 0.3,
    }));
    if (trendChart) trendChart.destroy();
    trendChart = new Chart(document.getElementById('trendChart'), {
      type: 'line', data: { labels: DATA.monthly.map(m => yoyLabel(m.month)), datasets: ds },
      options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { ticks: { callback: v=>'$'+v } } } }
    });
  }
  renderTrend();

  // Income Trend chart with source toggles
  const incByMonth = DATA.incByMonth || {};
  const allIncSources = Object.keys(incByMonth).sort((a,b) => {
    const ta = Object.values(incByMonth[a]).reduce((s,v)=>s+v,0);
    const tb = Object.values(incByMonth[b]).reduce((s,v)=>s+v,0);
    return tb - ta;
  });
  const _incDefault = allIncSources.filter(s => s !== 'Other Income').slice(0, 3);
  if (!_incDefault.includes('Rental Income') && allIncSources.includes('Rental Income')) _incDefault.push('Rental Income');
  const activeIncSources = new Set(_incDefault); // Top 3 by $ (excl Other Income) + Rental Income
  const incTrendContainer = document.getElementById('incTrendBtns');
  let incTrendChart = null;
  const incColors = ['#2ecc71','#3498db','#9b59b6','#f1c40f','#e67e22','#1abc9c','#e74c3c','#16a085'];

  const incClearBtn = document.createElement('span');
  incClearBtn.className = 'month-btn'; incClearBtn.textContent = '✕ Clear';
  incClearBtn.onclick = () => { activeIncSources.clear(); incTrendContainer.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active')); incClearBtn.classList.remove('active'); renderIncTrend(); };
  incTrendContainer.appendChild(incClearBtn);

  allIncSources.forEach(src => {
    const b = document.createElement('span');
    b.className = 'month-btn' + (activeIncSources.has(src) ? ' active' : '');
    b.textContent = src;
    b.onclick = () => {
      if (activeIncSources.has(src)) { activeIncSources.delete(src); b.classList.remove('active'); }
      else { activeIncSources.add(src); b.classList.add('active'); }
      renderIncTrend();
      // Also filter transactions to show this income source
      filterByIncCat(src);
    };
    incTrendContainer.appendChild(b);
  });

  function renderIncTrend() {
    const sources = [...activeIncSources];
    const ds = [];
    let incMax = 0;
    sources.forEach((src, i) => {
      const data = windowMonthly.map(m => (incByMonth[src]||{})[m.month]||0);
      incMax = Math.max(incMax, ...data);
      const color = incColors[i % incColors.length];
      ds.push({
        type: 'bar', label: src, data,
        backgroundColor: color, borderColor: color, borderWidth: 1,
      });
      // Add average line for this source (exclude zero months)
      const nonZero = data.filter(v => v > 0);
      if (nonZero.length > 0) {
        const avg = nonZero.reduce((s,v)=>s+v,0) / nonZero.length;
        ds.push({
          type: 'line',
          label: src + ' avg ($' + Math.round(avg).toLocaleString() + ')',
          data: data.map(() => avg),
          borderColor: color, borderDash: [6, 4], borderWidth: 1.5,
          pointRadius: 0, fill: false, tension: 0,
        });
      }
    });
    if (incTrendChart) incTrendChart.destroy();
    incTrendChart = new Chart(document.getElementById('incTrendChart'), {
      type: 'bar', data: { labels: months.map(yoyLabel), datasets: ds },
      options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { x: { stacked: false }, y: { stacked: false, suggestedMax: incMax * 1.28, ticks: { callback: v=>'$'+v.toLocaleString() } } } },
      // Draw the dollar amount on top of each bar, rotated vertical to reduce
      // horizontal crowding. Font is sized to fill the bar's width so labels are
      // easy to read (bar datasets only; skip avg lines & zero/hidden values).
      plugins: [{ afterDatasetsDraw(chart) {
        const ctx = chart.ctx;
        ctx.save();
        chart.data.datasets.forEach((dataset, di) => {
          if (dataset.type !== 'bar') return;            // only label the bars
          const meta = chart.getDatasetMeta(di);
          if (!meta || meta.hidden) return;
          ctx.fillStyle = dataset.backgroundColor || '#2c3e50';
          meta.data.forEach((bar, i) => {
            const val = dataset.data[i];
            if (!val || val <= 0) return;                // skip empty months
            const label = val >= 1000 ? '$' + (val/1000).toFixed(1) + 'k' : '$' + Math.round(val);
            // Maximize readability: labels are rotated vertical, so make the text
            // roughly as tall as the bar is wide (but never below a readable floor).
            // Wider bars -> bigger text; clamped to a sensible range.
            const barW = bar.width || 20;
            const size = Math.max(13, Math.min(barW * 0.85, 20));
            ctx.font = 'bold ' + size.toFixed(1) + 'px -apple-system, sans-serif';
            ctx.save();
            ctx.translate(bar.x, bar.y - 4);             // sit just above the bar
            ctx.rotate(-Math.PI / 2);                    // read bottom-to-top
            ctx.textAlign = 'left';                      // text grows upward from the bar
            ctx.textBaseline = 'middle';
            ctx.fillText(label, 0, 0);
            ctx.restore();
          });
        });
        ctx.restore();
      } }]
    });
  }
  renderIncTrend();

  // Merchants with buttons
  // All Transactions with buttons
  createMonthBtns('txnMonthBtns', m => {
    txnMonth = m;
    // Re-apply whichever view the user is currently looking at so picking a month
    // preserves an active income-source / income view instead of snapping to spending.
    if (txnMode === 'incomeSource' && txnIncSource) filterByIncCat(txnIncSource);
    else if (txnMode === 'incomeAll') renderIncTxns(m);
    else renderTxns();
  });
  const allCats = [...new Set(DATA.transactions.map(t=>t.Category))].sort();
  allCats.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; cSel.appendChild(o); });

  document.querySelectorAll('.sortable').forEach(th => {
    th.onclick = () => {
      const col = th.dataset.col;
      if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = col !== 'Date'; }
      // Re-render the active view so sorting doesn't drop an income view back to
      // spending. (Income renderers sort by Date desc internally; this at least
      // preserves the view and never regresses spending sort.)
      if (txnMode === 'incomeSource' && txnIncSource) filterByIncCat(txnIncSource);
      else if (txnMode === 'incomeAll') renderIncTxns(txnMonth);
      else renderTxns();
    };
  });

  window.filterByCat = function(cat) {
    cSel.value = cat;
    txnMonth = '';  // Clear month filter so ALL transactions for this category show
    renderTxns();
    document.getElementById('filterCat').scrollIntoView({behavior:'smooth'});
  }

  window.filterByMerch = function(merch) {
    cSel.value = '';
    document.getElementById('filterSearch').value = merch;
    renderTxns();
    document.getElementById('filterSearch').scrollIntoView({behavior:'smooth'});
  }

  window.filterByIncCat = function(cat) {
    txnMode = 'incomeSource';
    txnIncSource = cat;
    cSel.value = '';
    document.getElementById('filterSearch').value = '';
    let filtered = (DATA.incomeTransactions||[]).filter(t => t.IncomeSource === cat);
    // Keep the specific-month scoping the user asked for (skip when YTD / no month).
    if (txnMonth) filtered = filtered.filter(t => t.Month === txnMonth);
    filtered.sort((a,b) => b.Date.localeCompare(a.Date));
    const total = filtered.reduce((s,t) => s + t.Amount, 0);
    const tbody = document.getElementById('txnBody');
    if (filtered.length === 0) {
      // Explicit empty state so a source with no income in the chosen month never
      // looks broken (e.g. Esther Paycheck in 2026-10).
      const whenMsg = txnMonth ? ` in ${monthLabel(txnMonth)} ${txnMonth.split('-')[0]}` : '';
      tbody.innerHTML = `<tr><td colspan="5" style="padding:16px;text-align:center;color:#888;">No ${cat} income${whenMsg}</td></tr>`;
      document.getElementById('txnCount').textContent = `0 income transactions — no ${cat} income${whenMsg}`;
    } else {
      tbody.innerHTML = filtered.map(t => `<tr><td>${t.Date}</td><td>${t.IncomeSource}</td><td>Income</td><td>—</td><td class="positive">+$${t.Amount.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>`).join('');
      document.getElementById('txnCount').textContent = `${filtered.length} income transactions • $${total.toLocaleString(undefined,{maximumFractionDigits:0})} total`;
    }
    document.getElementById('filterCat').scrollIntoView({behavior:'smooth'});
  }

  function renderIncTxns(month) {
    txnMode = 'incomeAll';
    txnIncSource = null;
    cSel.value = '';
    document.getElementById('filterSearch').value = '';
    let filtered = (DATA.incomeTransactions||[]);
    if (month) filtered = filtered.filter(t => t.Month === month);
    filtered.sort((a,b) => b.Date.localeCompare(a.Date));
    const total = filtered.reduce((s,t) => s + t.Amount, 0);
    const tbody = document.getElementById('txnBody');
    tbody.innerHTML = filtered.map(t => `<tr><td>${t.Date}</td><td>${t.IncomeSource}</td><td>Income</td><td>—</td><td class="positive">+$${t.Amount.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>`).join('');
    document.getElementById('txnCount').textContent = `${filtered.length} income transactions • $${total.toLocaleString(undefined,{maximumFractionDigits:0})} total`;
  }

  function renderTxns() {
    txnMode = 'spending';
    txnIncSource = null;
    const cat = cSel.value, search = document.getElementById('filterSearch').value.toLowerCase();
    let filtered = DATA.transactions;
    if (txnMonth) filtered = filtered.filter(t => t.Month === txnMonth);
    if (cat) filtered = filtered.filter(t => t.Category === cat);
    if (search) filtered = filtered.filter(t => t.Merchant.toLowerCase().includes(search));
    filtered.sort((a,b) => {
      let va = a[sortCol], vb = b[sortCol];
      if (sortCol === 'Spend') return sortAsc ? va - vb : vb - va;
      return sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
    });
    const total = filtered.reduce((s,t) => s+t.Spend, 0);
    document.getElementById('txnBody').innerHTML = filtered.slice(0,200).map(t =>
      `<tr><td>${t.Date}</td><td>${t.Merchant}</td><td><span class="pill">${t.Category}</span></td><td style="font-size:11px;color:#888">${t.Account}</td><td class="amount">$${t.Spend.toFixed(2)}</td></tr>`
    ).join('');
    document.getElementById('txnCount').textContent = `${filtered.length} transactions • $${total.toLocaleString(undefined,{maximumFractionDigits:0})} total`;
  }
  cSel.onchange = document.getElementById('filterSearch').oninput = renderTxns;
  renderTxns();
}).catch(e => { document.getElementById('loading').textContent = 'Error loading data: ' + e; });
</script>
</body>
</html>
